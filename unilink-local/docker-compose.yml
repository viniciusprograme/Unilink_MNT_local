# UNILINK — hospedagem local (Docker). Subir: docker compose up -d --build
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  db:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: unilink
      POSTGRES_USER: unilink
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: America/Fortaleza
      PGTZ: America/Fortaleza
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
      - ./dump:/dump
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unilink -d unilink"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql://unilink:${DB_PASSWORD}@db:5432/unilink
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      TOKEN_TTL: ${TOKEN_TTL:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      UPLOAD_DIR: /app/uploads
      PORT: 3001
      TZ: America/Fortaleza
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - apilogs:/app/logs
    # sem "ports": a API só é acessível pelo nginx (web), em /api

  web:
    build: ./web
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  apilogs:
  caddy_data:
  caddy_config:
